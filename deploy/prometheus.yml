global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (metrics-strategy §3). No Alertmanager configured — Prometheus evaluates these
# and shows firing alerts on its own /alerts page. Alertmanager routing is deferred (no on-call).
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: markit-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: markit-scraper
    metrics_path: /metrics
    static_configs:
      - targets: ["scraper:8000"]
