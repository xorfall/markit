# markit — full walking-skeleton stack (ADR-0005). Best-effort single instance.
# Data infra + observability backends + backend + scraper. Secrets via env / .env (not committed).

name: markit

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-markit}
      POSTGRES_USER: ${DB_USER:-markit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-markit}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-markit} -d ${DB_NAME:-markit}"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  backend:
    build: ../backend
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      ES_URIS: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  scraper:
    build: ../scraper
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      RABBITMQ_HOST: rabbitmq
      OTLP_ENDPOINT: http://jaeger:4318
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Optional scheduled Postgres backups (R-OPS-01). OFF by default — only starts under the
  # `backups` profile:  docker compose --profile backups up -d backup
  # Reuses the postgres:16 image (matching pg_dump version) and runs backup.sh on an interval.
  backup:
    image: postgres:16
    profiles: ["backups"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-markit}
      DB_USER: ${DB_USER:-markit}
      PGPASSWORD: ${DB_PASSWORD:-markit}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Interval between runs, seconds. Default 24h. Override for demos/tests.
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - "./backup.sh:/usr/local/bin/backup.sh:ro"
      - "backups:/backups"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "[backup] loop starting; interval=${BACKUP_INTERVAL_SECONDS:-86400}s dir=$$BACKUP_DIR retention=$${RETENTION_DAYS}d";
        while true; do
          bash /usr/local/bin/backup.sh || echo "[backup] run failed (continuing)";
          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}";
        done
    restart: unless-stopped

volumes:
  pgdata:
  esdata:
  backups:
