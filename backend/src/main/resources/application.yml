spring:
  application:
    name: markit-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:markit}
    username: ${DB_USER:markit}
    password: ${DB_PASSWORD:markit}
  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema (db-migration-agent)
    open-in-view: false
  flyway:
    enabled: true
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Single-threaded consumption preserves per-aggregate order (NFR-CONS-003).
        concurrency: 1
        max-concurrency: 1
        # A message that keeps failing is retried then rejected (not requeued) so it is
        # dead-lettered to the DLQ instead of blocking the queue (poison isolation, ADR-0003).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 500ms
          multiplier: 2
          max-interval: 5s

server:
  port: 8080

# Security (ADR-0006). Secret MUST be overridden in prod via MARKIT_JWT_SECRET (NFR-SEC-004);
# the default is a clearly-non-secret dev value, long enough (>=32 bytes) for HS256.
markit:
  security:
    jwt:
      secret: ${MARKIT_JWT_SECRET:dev-only-insecure-change-me-please-0123456789abcdef}
      access-token-validity: PT15M
      refresh-token-validity: P30D
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  # Transactional outbox relay (ADR-0003, S3).
  outbox:
    poll-interval-ms: 1000
    batch-size: 100
    max-attempts: 5

# Observability (NFR-OBS-*)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      # ES and RabbitMQ are degradable (ADR-0007, NFR-AVAIL-002/003): they report in overall
      # health but must NOT gate readiness. Postgres (db) is essential and does.
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      application: markit-backend
  tracing:
    sampling:
      probability: 1.0        # 100% in dev; tune for prod
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Structured JSON logs with trace ids (Spring Boot 3.4 native structured logging, NFR-OBS-001)
logging:
  structured:
    format:
      console: ecs
