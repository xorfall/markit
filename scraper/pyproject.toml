[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markit-scraper"
version = "0.1.0"
description = "Markit scrape service: fetches user-supplied URLs and extracts content (S0 walking skeleton)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Markit Team" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    # Declared for later phases (two-phase extraction + headless fallback).
    # NOT invoked in S0.
    "trafilatura>=1.12",
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
