[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markit-scraper"
version = "0.1.0"
description = "Markit scrape service: fetches user-supplied URLs and extracts content (S0 walking skeleton)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Markit Team" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    # Prometheus metrics exposition (/metrics endpoint + worker instrumentation).
    "prometheus-client>=0.20",
    # SSRF-safe fetching (manual redirects, streamed byte cap).
    "httpx>=0.27",
    # RabbitMQ consumer/publisher.
    "aio-pika>=9.4",
    # Two-phase extraction (phase 2). Imported lazily so tests run without it.
    "trafilatura>=1.12",
    # Headless-browser fallback for JS pages. Imported lazily; never launched
    # in tests.
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
