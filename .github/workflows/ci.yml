name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # `verify` runs unit + architecture tests and the Testcontainers integration tests.
      # (Crown-jewel security/consistency tests join the required set as slices land.)
      - name: Build & test
        run: mvn -B verify

  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pytest
